; =====================================================================
;  PlatformIO - VERDALIA, monitor del NFT de lechuga (Cuenca - Ecuador)
;  Monitoreo + automatizacion basica del sistema NFT de lechuga
; ---------------------------------------------------------------------
;  Abre ESTA carpeta (firmware/monitor_nft) en VSCode con PlatformIO.
;
;  Hardware conectado (ESP32 WROOM-32 / esp32dev):
;    DS18B20 sumergible (modulo) DATA -> GPIO4   VCC -> 3V3   GND -> GND
;    DHT22 / AM2302              DATA -> GPIO16  VCC -> 3V3   GND -> GND
;    Flotador de nivel           un cable -> GPIO27, el otro -> GND
;    Modulo SSR 5V (1 canal)     IN   -> GPIO26  VCC -> VIN(5V) GND -> GND
;    Rele ventilador G3MB-202P   IN   -> GPIO25  VCC -> VIN(5V) GND -> GND
;    LED onboard                 GPIO2 (latido de estado)
;
;  ATENCION: el SSR conmuta 120V AC de la bomba. Fusible + borneras +
;  caja estanca. No dejes el modulo al aire dentro del invernadero.
;
;  Antes de compilar: edita include/config.h (WiFi + topic de ntfy).
; =====================================================================

[env:esp32dev]
platform      = espressif32 @ ^6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; huge_app = 3 MB para la app (en vez de 1.3 MB). Sacrifica OTA, que no usamos.
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Mete el panel web (../../panel/public) comprimido en include/web_files.h
extra_scripts = pre:scripts/embed_web.py

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0
